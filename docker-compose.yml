services:
  db:
    # 拉不动 Docker Hub 时可用 UTOPIA_DB_IMAGE 覆盖为任何带 pgvector 的 PG16+ 镜像
    image: ${UTOPIA_DB_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: ${UTOPIA_DB_PASSWORD:-utopia}
      POSTGRES_DB: utopia
    ports:
      # 只绑回环。app 走 compose 网络连库，这个映射纯粹是给本地开发用的
      # （cargo run 时从宿主机连）——绑 0.0.0.0 等于把一个默认口令的数据库
      # 挂到公网。宿主机端口被占时用 UTOPIA_DB_BIND 覆盖，如 127.0.0.1:15432。
      - "${UTOPIA_DB_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utopia -d utopia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 完整部署：docker compose --profile app up -d
  # 本地开发只起 db，应用用 cargo run 跑
  #
  # 这里只写 image 不写 build：两者并存时，本地没有镜像的 up 会去"构建"而不是
  # "拉取"，预构建镜像就白发了。要从源码起，叠加 docker-compose.build.yml。
  app:
    # 钉在已发布的具体版本。latest 只在 release.yml 见到 v* tag 时才打，而本仓库
    # 至今没有 tag——默认值写 latest 的话，clone 下来照 README 跑第一条命令就是
    # manifest unknown。发布 v0.1.0 后改这里（或改成 latest 让它自动跟随）。
    image: ${UTOPIA_IMAGE:-ghcr.io/deeplethe/utopia:0.1.0-rc2}
    profiles: ["app"]
    environment:
      UTOPIA_DATABASE_URL: postgres://utopia:${UTOPIA_DB_PASSWORD:-utopia}@db:5432/utopia
      UTOPIA_BIND_ADDR: 0.0.0.0:8080
      UTOPIA_JWT_SECRET: ${UTOPIA_JWT_SECRET:-please-change-me-in-production}
      UTOPIA_WEB_DIST: /app/web-dist
      UTOPIA_DATA_DIR: /app/data
      # 连接池上限。缺省 32，与 worker 并发的缺省对齐；池子小于并发时症状是
      # 请求变慢而不是报错说池子不够，所以调并发时别忘了它。
      # 上调前先确认 Postgres 的 max_connections（默认 100）容得下。
      UTOPIA_DB_MAX_CONNECTIONS: ${UTOPIA_DB_MAX_CONNECTIONS:-32}
    volumes:
      # 原始文件（files/）与全文索引（index/）。不挂出来的话，容器一重建
      # 它们就没了，而库里的 documents 记录还在——引用全断且不报错。
      # 备份 = 这个目录 + 数据库。
      - ./data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
