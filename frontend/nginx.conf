server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — every unknown path serves index.html so client-side routing works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — same-origin reverse proxy to the backend service (so the browser never makes a
    # cross-origin call; no CORS config needed in this setup).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # long-running extraction jobs / progress polling
    }
}
