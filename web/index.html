<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 标签页图标：public/favicon.svg 原样进产物根目录，由服务端托管 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap"
    />
    <title>Utopia</title>
    <!-- 首帧前定主题：与 src/theme.ts 同一套解法。放在 head 里、样式之前，
         刷新时才不会先闪一下暗底再变浅 -->
    <script>
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("utopia.theme") || "dark"; } catch (e) {}
        if (t === "system")
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var resolved = t === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = resolved;
        if (resolved === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
